name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build CheatPayload (DLL)
      run: dotnet build CheatPayload.csproj -c Release

    - name: Prepare Launcher Resources
      run: |
        mkdir -p Launcher/GnomiumMenu/Resources
        cp bin/Release/netstandard2.1/CheatPayload.dll Launcher/GnomiumMenu/Resources/
        
    - name: Download SharpMonoInjector
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/warbler/SharpMonoInjector/releases/download/v2.2/SharpMonoInjector.Console.zip" -OutFile "smi.zip"
        Expand-Archive -Path "smi.zip" -DestinationPath "smi_temp"
        cp smi_temp/smi.exe Launcher/GnomiumMenu/Resources/
        cp smi_temp/SharpMonoInjector.dll Launcher/GnomiumMenu/Resources/

    - name: Publish Launcher (Standalone EXE)
      run: |
        cd Launcher/GnomiumMenu
        dotnet publish GnomiumMenu.csproj -c Release -p:PublishSingleFile=true -p:SelfContained=false -r win-x64 --output publish_out

    - name: Prepare Release Archive
      shell: pwsh
      run: |
        Compress-Archive -Path "Launcher/GnomiumMenu/publish_out/GnomiumMenu.exe" -DestinationPath "GnomiumMenu.zip"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GnomiumMenu
        path: GnomiumMenu.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: GnomiumMenu.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
